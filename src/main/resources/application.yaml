spring:
  application:
    name: dualcritic-ai

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  ai:
    openai:
        api-key: ${OPENAI_API_KEY}
        base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
        timeout: 30s

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,beans,mappings
  endpoint:
    health:
      show-details: always

server:
  port: 8080